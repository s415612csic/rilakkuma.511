<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>奶龍互動小屋</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:#f8e8c8;color:#65401e;user-select:none}
.app{max-width:1200px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;gap:15px;align-items:center;background:#fffaf0dd;padding:15px 20px;border-radius:24px;box-shadow:0 8px 25px #7b4b2222}
h1{margin:0;color:#e99520;font-size:27px}.sub{font-size:12px;color:#9a7041}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#fff3cf;padding:8px 12px;border-radius:15px;min-width:125px;font-size:13px}.stat b{display:block;font-size:17px}
.bar{height:8px;background:#eadbc0;border-radius:99px;overflow:hidden;margin-top:5px}.fill{height:100%;width:50%;background:#ffb52e;transition:.3s}
.layout{display:grid;grid-template-columns:220px 1fr 230px;gap:15px;margin-top:15px}
.panel{background:#fffaf0e8;padding:16px;border-radius:22px;box-shadow:0 8px 25px #7b4b2220}
.panel h2{font-size:17px;margin:0 0 10px}.btn{width:100%;border:0;background:#ffedbd;color:#65401e;padding:11px;margin:4px 0;border-radius:14px;font-weight:bold;font-size:14px;cursor:pointer}.btn:hover{transform:translateY(-2px);background:#ffe29a}
.foods{display:grid;grid-template-columns:1fr 1fr;gap:7px}.food{background:#fff;border:2px dashed #e7bf70;border-radius:12px;padding:9px;text-align:center;font-size:25px;cursor:grab}.food small{display:block;font-size:11px}
.room{position:relative;height:680px;overflow:hidden;border:4px solid white;border-radius:28px;background:linear-gradient(#ccecff 0 61%,#c9945d 61%);box-shadow:0 12px 30px #6b401f25}
.wall{position:absolute;inset:0 0 39% 0;background:repeating-linear-gradient(90deg,#f7ddb3 0 80px,#efd0a0 81px 83px)}
.floor{position:absolute;left:0;right:0;bottom:0;height:39%;background:repeating-linear-gradient(90deg,#d59c63 0 6px,#e9bd82 6px 78px)}
.window{position:absolute;left:6%;top:8%;width:27%;height:24%;border:8px solid #d08c4b;border-radius:12px;background:linear-gradient(#8bdcff 0 65%,#9bd36c 65%);overflow:hidden;box-shadow:0 5px 12px #68401f22}.window:after{content:"☁️   ☁️";position:absolute;top:15%;left:15%;font-size:25px}.curtain{position:absolute;top:0;width:18%;height:100%;background:#bde0b0}.curtain.l{left:0}.curtain.r{right:0}
.clock{position:absolute;right:7%;top:8%;font-size:38px;background:#fff9e8;border-radius:50%;padding:8px}
.shelf{position:absolute;right:5%;top:30%;width:25%;height:48px;background:#a96735;border-radius:7px;display:flex;justify-content:space-around;align-items:center;font-size:25px;box-shadow:0 5px #855027}
.bed{position:absolute;left:4%;bottom:10%;width:28%;height:22%;background:#fff6df;border:6px solid #b8733e;border-radius:22px;z-index:2;cursor:pointer;box-shadow:0 8px #8e572e}.bed:before{content:"";position:absolute;top:-20px;left:-6px;width:100%;height:30px;background:#e7ae6d;border-radius:15px}.bed span{position:absolute;right:8px;bottom:7px;font-size:10px;font-weight:bold}
.desk{position:absolute;right:4%;bottom:9%;width:29%;height:21%;z-index:2;cursor:pointer}.desk .top{height:30%;background:#b8733e;border-radius:9px;padding:6px;text-align:center;font-size:22px;box-shadow:0 5px #8e572e}.leg{position:absolute;top:28%;width:14px;height:72%;background:#96592f}.leg.a{left:9%}.leg.b{right:9%}
.fridge{position:absolute;right:34%;bottom:9%;width:12%;height:30%;background:#f7f4e9;border:5px solid #aaa08b;border-radius:10px;z-index:2;cursor:pointer;box-shadow:0 6px #887c66;text-align:center}.fridge div{padding:9px;border-bottom:3px solid #c9c1ad}.fridge small{font-size:10px}
.toybox{position:absolute;left:38%;bottom:9%;width:14%;height:14%;background:#f2aa58;border:5px solid #ad672f;border-radius:10px;z-index:3;text-align:center;padding:7px;cursor:pointer;box-shadow:0 6px #8f522a}.toybox div{font-size:22px}.toybox small{font-size:10px;font-weight:bold}
.rug{position:absolute;left:24%;bottom:4%;width:54%;height:18%;background:#d9e9a8;border:8px solid #b7d17e;border-radius:50%;z-index:1}
.plant{position:absolute;right:1%;bottom:31%;font-size:45px}.picture{position:absolute;left:43%;top:9%;background:#fff5db;border:6px solid #ca8848;padding:5px 10px;border-radius:8px;font-size:25px}
.bubble{position:absolute;z-index:20;top:6%;left:50%;transform:translateX(-50%);background:white;border:3px solid #ffd16b;border-radius:20px;padding:12px 17px;font-weight:bold;opacity:0;transition:.25s;pointer-events:none}.bubble.show{opacity:1}.bubble:after{content:"";position:absolute;bottom:-10px;left:50%;border:10px solid transparent;border-top-color:#ffd16b;border-bottom:0;transform:translateX(-50%)}
#pet{position:absolute;width:260px;z-index:10;cursor:grab;touch-action:none;filter:drop-shadow(0 12px 8px #70451b33)}#pet.dragging{cursor:grabbing;transform:scale(1.04) rotate(-2deg);filter:drop-shadow(0 16px 10px #70451b44)}
#petCanvas{display:none}.outfit{position:absolute;z-index:15;pointer-events:auto;font-size:72px;display:none;cursor:grab;touch-action:none}.outfit.dragging{cursor:grabbing;transform:scale(1.06)}.outfit.show{display:block}.heart{position:absolute;z-index:30;font-size:35px;opacity:0;pointer-events:none}.heart.pop{animation:heart 1s ease}
@keyframes heart{0%{opacity:0;transform:translateY(10px) scale(.5)}35%{opacity:1}100%{opacity:0;transform:translateY(-55px) scale(1.2)}}
.happy{animation:happy .55s ease}.eat{animation:eat .65s ease}.sad{animation:sad .4s ease}@keyframes happy{50%{transform:scale(1.06) translateY(-10px)}}@keyframes eat{40%{transform:scale(1.07)}}@keyframes sad{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.meter{margin:12px 0}.meter label{display:flex;justify-content:space-between;font-size:12px;font-weight:bold}
.log{background:#fff5dc;padding:10px;border-radius:14px;line-height:1.6;font-size:12px;max-height:170px;overflow:auto}
.modal{position:fixed;inset:0;background:#4e351f77;display:none;align-items:center;justify-content:center;z-index:100}.modal.open{display:flex}.card{background:#fffaf0;border-radius:22px;padding:20px;width:min(430px,90%)}.closet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cloth{border:2px solid #e6c47a;background:white;border-radius:14px;padding:13px;font-size:30px;cursor:pointer}
@media(max-width:900px){.layout{grid-template-columns:1fr}.room{height:620px}.panel{order:2}}
@media(max-width:600px){.room{height:560px}.window{width:35%}.shelf,.clock,.picture{display:none}#pet{width:190px}.bed{width:34%}.desk{width:34%}.fridge{right:37%}}
</style>
</head>
<body>
<div class="app">
<header>
<div><h1>🐲 奶龍互動小屋</h1><div class="sub">陪奶龍玩耍、餵食，培養你們的親密度！</div></div>
<div class="stats">
<div class="stat">💗 親密度 <b id="loveText">20 / 100</b><div class="bar"><div id="loveBar" class="fill"></div></div></div>
<div class="stat">😊 心情 <b id="moodText">開心</b></div>
<div class="stat">🍽️ 飽足 <b id="foodText">60%</b></div>
</div>
</header>

<div class="layout">
<aside class="panel">
<h2>🎮 互動</h2>
<button class="btn" onclick="head()">👋 摸摸頭</button>
<button class="btn" onclick="belly()">👉 摸摸肚子</button>
<button class="btn" onclick="hug()">🫶 抱抱</button>
<button class="btn" onclick="play()">🎈 一起玩</button>
<button class="btn" onclick="openCloset()">👕 換裝</button>
<h2 style="margin-top:17px">🍴 餵食</h2>
<div class="foods">
<div class="food" draggable="true" data-icon="🍎" data-food="12" data-love="5">🍎<small>蘋果</small></div>
<div class="food" draggable="true" data-icon="🍓" data-food="10" data-love="4">🍓<small>草莓</small></div>
<div class="food" draggable="true" data-icon="🍰" data-food="18" data-love="8">🍰<small>蛋糕</small></div>
<div class="food" draggable="true" data-icon="🍙" data-food="15" data-love="6">🍙<small>飯糰</small></div>
</div>
<p style="font-size:11px;text-align:center;color:#9b7247">也可以把食物拖到奶龍身上！</p>
</aside>

<main class="room" id="room">
<div class="wall"></div><div class="floor"></div>
<div class="window"><div class="curtain l"></div><div class="curtain r"></div></div>
<div class="clock">🕐</div><div class="picture">🌈<br><small>奶龍的家</small></div>
<div class="shelf">🧸 📚 🪴 ⭐</div>
<div class="bed" onclick="roomAction('bed')">☁️ 💛 <span>奶龍小床</span></div>
<div class="desk" onclick="roomAction('desk')"><div class="top">💻 📒 ✏️</div><div class="leg a"></div><div class="leg b"></div></div>
<div class="fridge" onclick="roomAction('fridge')"><div>❄️ 🧊</div><small>冰箱<br>🍎🍓🍰</small></div>
<div class="toybox" onclick="roomAction('toy')"><div>🧸 🎾 🪀</div><small>玩具箱</small></div>
<div class="plant">🪴</div><div class="rug"></div>
<div class="bubble" id="bubble">今天也要一起玩嗎？✨</div>

<img id="pet" alt="奶龍">
<div id="outfit" class="outfit">🎩</div>
<div id="heart" class="heart">💗</div>
<canvas id="petCanvas"></canvas>
</main>

<aside class="panel">
<h2>📋 奶龍狀態</h2>
<div class="meter"><label><span>💗 親密度</span><span id="loveNum">20%</span></label><div class="bar"><div id="loveBar2" class="fill"></div></div></div>
<div class="meter"><label><span>🍽️ 飽足度</span><span id="foodNum">60%</span></label><div class="bar"><div id="foodBar" class="fill"></div></div></div>
<div class="log" id="log">奶龍正在房間裡等你～</div>
</aside>
</div>
</div>

<div class="modal" id="modal"><div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><h2>👕 奶龍衣櫃</h2><button class="btn" style="width:auto" onclick="closeCloset()">關閉</button></div>
<p>服裝會跟著奶龍移動。</p>
<div class="closet">
<button class="cloth" onclick="wear('🎩','小紳士','head')">🎩</button>
<button class="cloth" onclick="wear('👑','小國王','head')">👑</button>
<button class="cloth" onclick="wear('🎓','小學者','head')">🎓</button>
<button class="cloth" onclick="wear('🧢','休閒帽','head')">🧢</button>
<button class="cloth" onclick="wear('🕶️','酷酷龍','face')">🕶️</button>
<button class="cloth" onclick="wear('🎀','可愛龍','side')">🎀</button>
<button class="cloth" onclick="clearOutfit()">❌<small style="display:block;font-size:10px">清除服裝</small></button>
</div></div></div>

const pet=document.getElementById("pet"),canvas=document.getElementById("petCanvas"),ctx=canvas.getContext("2d");
const room=document.getElementById("room"),outfit=document.getElementById("outfit");
let love=Number(localStorage.love||20), food=Number(localStorage.food||60), mood=localStorage.mood||"開心";
let outfitData=JSON.parse(localStorage.outfit||'null');
let pos=JSON.parse(localStorage.petPos||'null'), dragging=false, moved=false, ox=0, oy=0;
let outfitDragging=false, outfitMoved=false, outfitOX=0, outfitOY=0;
let outfitOffset=JSON.parse(localStorage.outfitOffset||'null');

const img=new Image();
img.onload=()=>{
  canvas.width=img.naturalWidth; canvas.height=img.naturalHeight; ctx.drawImage(img,0,0);
  const d=ctx.getImageData(0,0,canvas.width,canvas.height), p=d.data;
  for(let i=0;i<p.length;i+=4){
    const r=p[i],g=p[i+1],b=p[i+2];
    // 將接近白色的背景變透明
    if(r>242 && g>242 && b>242){p[i+3]=0}
  }
  ctx.putImageData(d,0,0);
  pet.src=canvas.toDataURL("image/png");
  placePet();
};
img.src=imgData;

function clamp(v){return Math.max(0,Math.min(100,v))}
function save(){
  localStorage.love=love;localStorage.food=food;localStorage.mood=mood;
  localStorage.outfit=JSON.stringify(outfitData);
  localStorage.petPos=JSON.stringify(pos);
  localStorage.outfitOffset=JSON.stringify(outfitOffset);
}
function update(){
 love=clamp(love);food=clamp(food);
 document.getElementById("loveText").textContent=love+" / 100";document.getElementById("loveNum").textContent=love+"%";
 document.getElementById("loveBar").style.width=love+"%";document.getElementById("loveBar2").style.width=love+"%";
 document.getElementById("foodText").textContent=food+"%";document.getElementById("foodNum").textContent=food+"%";document.getElementById("foodBar").style.width=food+"%";
 document.getElementById("moodText").textContent=mood; save();
}
function say(t,type="happy"){
 const b=document.getElementById("bubble");b.textContent=t;b.classList.add("show");
 pet.classList.remove("happy","eat","sad");void pet.offsetWidth;pet.classList.add(type);
 setTimeout(()=>b.classList.remove("show"),2300);
}
function heart(){
 const h=document.getElementById("heart");h.classList.remove("pop");void h.offsetWidth;h.classList.add("pop");
}
function log(t){document.getElementById("log").innerHTML=t+"<br>"+document.getElementById("log").innerHTML}
function head(){love+=3;mood="超開心";update();say("嘿嘿～摸摸頭最喜歡了！💗");heart();log("你摸了奶龍的頭 💗")}
function belly(){love+=1;if(food<35){mood="餓肚子";say("肚子餓了……可以餵我嗎？🥺","sad")}else{mood="滿足";say("肚肚被摸摸，好舒服～😋")}update();log("你摸了奶龍的肚子。")}
function hug(){love+=5;mood="滿足";update();say("抱抱～～最喜歡你了！🫶");heart();log("你給奶龍一個抱抱 💗")}
function play(){love+=4;mood="興奮";update();say("一起玩！一起玩！🎈");heart();log("你陪奶龍一起玩 🎾")}
function feed(icon,amount,gain){food+=amount;love+=gain;mood="滿足";update();say(icon+" 好好吃！謝謝你～💗","eat");heart();log("你餵奶龍吃了 "+icon)}
function clearOutfit(){
  outfitData=null;
  outfitOffset=null;
  localStorage.removeItem("outfit");
  localStorage.removeItem("outfitOffset");
  outfit.classList.remove("show");
  love=Math.max(0,love-1);
  mood="開心";
  update();
  closeCloset();
  say("呼～換回原本的樣子了！🐲");
  log("你幫奶龍清除了服裝。");
}

function roomAction(t){
 if(t==="bed"){love+=2;mood="放鬆";say("我的小床軟綿綿的～💤");log("你來到奶龍的小床。")}
 if(t==="desk"){love+=2;mood="期待";say("今天要認真學習！✏️");log("你看看奶龍的書桌。")}
 if(t==="fridge"){love+=2;mood=food<40?"期待":"滿足";say(food<40?"冰箱裡有好吃的！快餵我～🍎":"冰箱裡還有好多食物！");log("你打開了奶龍的冰箱。")}

function openCloset(){document.getElementById("modal").classList.add("open")}
function closeCloset(){document.getElementById("modal").classList.remove("open")}
function wear(icon,name,where){outfitData={icon,name,where};outfitOffset=null;love+=3;mood="開心";update();applyOutfit();closeCloset();say("哇！"+name+" 好好看！✨");log("你幫奶龍換上 "+name+"。")}
function applyOutfit(){
  if(!outfitData){
    outfit.classList.remove("show");
    return;
  }
  outfit.textContent=outfitData.icon;
  outfit.classList.add("show");

  // 第一次穿戴時給每種服裝一個預設位置；之後保留玩家拖動的位置
  if(!outfitOffset){
    outfitOffset={
      x: outfitData.where==="side" ? 0.61 : 0.50,
      y: outfitData.where==="face" ? 0.25 : 0.05
    };
  }

  outfit.style.left=(pos.x+pet.offsetWidth*outfitOffset.x)+"px";
  outfit.style.top=(pos.y+pet.offsetHeight*outfitOffset.y)+"px";
  outfit.style.fontSize=outfitData.where==="face"?"48px":"72px";
}
function placePet(){
  if(!pos){pos={x:(room.clientWidth-260)/2,y:room.clientHeight-300}}
  const maxX=room.clientWidth-pet.offsetWidth, maxY=room.clientHeight-pet.offsetHeight;
  pos.x=Math.max(0,Math.min(maxX,pos.x));
  pos.y=Math.max(0,Math.min(maxY,pos.y));
  pet.style.left=pos.x+"px";
  pet.style.top=pos.y+"px";
  applyOutfit();
}
function pointerStart(e){
 e.preventDefault();dragging=true;moved=false;pet.classList.add("dragging");
 const r=room.getBoundingClientRect();
 const x=e.clientX-r.left,y=e.clientY-r.top;
 ox=x-pos.x;oy=y-pos.y;pet.setPointerCapture?.(e.pointerId);
}
function pointerMove(e){
 if(!dragging)return;
 const r=room.getBoundingClientRect();
 let x=e.clientX-r.left-ox,y=e.clientY-r.top-oy;
 const maxX=room.clientWidth-pet.offsetWidth,maxY=room.clientHeight-pet.offsetHeight;
 pos.x=Math.max(0,Math.min(maxX,x));pos.y=Math.max(0,Math.min(maxY,y));
 pet.style.left=pos.x+"px";pet.style.top=pos.y+"px";
 outfit.style.left=(pos.x+pet.offsetWidth*(outfitData?.where==="side"?.61:.5))+"px";
 outfit.style.top=(pos.y+pet.offsetHeight*(outfitData?.where==="face"?.25:.05))+"px";
 moved=true;
}
function pointerEnd(e){
 if(!dragging)return;dragging=false;pet.classList.remove("dragging");save();
 if(moved){say("把我放到這裡就好～✨");log("你把奶龍拖到了房間的新位置。")}
}
pet.addEventListener("pointerdown",pointerStart);pet.addEventListener("pointermove",pointerMove);pet.addEventListener("pointerup",pointerEnd);pet.addEventListener("pointercancel",pointerEnd);
pet.addEventListener("click",e=>{if(!moved)head();moved=false});


// ===== 服裝拖曳 =====
// 可以把帽子、皇冠、墨鏡、蝴蝶結等直接拖到奶龍頭上合適的位置。
// 拖動後會保存位置，下次重新整理仍會保留。
outfit.addEventListener("pointerdown",e=>{
  if(!outfitData)return;
  e.preventDefault();
  e.stopPropagation();
  outfitDragging=true;
  outfitMoved=false;
  outfit.classList.add("dragging");
  const r=room.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  outfitOX=x-parseFloat(outfit.style.left);
  outfitOY=y-parseFloat(outfit.style.top);
  outfit.setPointerCapture?.(e.pointerId);
});

outfit.addEventListener("pointermove",e=>{
  if(!outfitDragging)return;
  e.preventDefault();
  e.stopPropagation();
  const r=room.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  let nx=x-outfitOX, ny=y-outfitOY;

  // 將服裝限制在奶龍附近，避免拖到房間外
  const minX=Math.max(0,pos.x-outfit.offsetWidth*.45);
  const maxX=Math.min(room.clientWidth-outfit.offsetWidth,pos.x+pet.offsetWidth-outfit.offsetWidth*.15);
  const minY=Math.max(0,pos.y-outfit.offsetHeight*.55);
  const maxY=Math.min(room.clientHeight-outfit.offsetHeight,pos.y+pet.offsetHeight*.45);

  nx=Math.max(minX,Math.min(maxX,nx));
  ny=Math.max(minY,Math.min(maxY,ny));

  outfit.style.left=nx+"px";
  outfit.style.top=ny+"px";

  outfitOffset={
    x:(nx-pos.x)/pet.offsetWidth,
    y:(ny-pos.y)/pet.offsetHeight
  };
  outfitMoved=true;
});

outfit.addEventListener("pointerup",e=>{
  if(!outfitDragging)return;
  outfitDragging=false;
  outfit.classList.remove("dragging");
  save();
  if(outfitMoved){
    say("這個位置很適合我！✨");
    log("你把服裝拖到了奶龍身上的新位置。");
  }
  outfitMoved=false;
});
outfit.addEventListener("pointercancel",e=>{
  outfitDragging=false;
  outfit.classList.remove("dragging");
});

update();
